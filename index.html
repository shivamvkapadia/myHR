<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>myHR — People operations, beautifully organized</title>
<meta name="description" content="myHR brings your team directory, onboarding automations and task boards into one calm workspace, synced with Slack." />
<meta name="theme-color" content="#ffffff" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6.5' fill='%239bd8a9'/%3E%3Cpath d='M7 8.2h10M7 12h5.5M7 15.8h7.5' stroke='%23030302' stroke-width='2.1' stroke-linecap='round'/%3E%3Ccircle cx='16.6' cy='12' r='1.35' fill='%23030302'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/pages.css" />
<script>
  // Apply saved theme before first paint to avoid a flash.
  try {
    var a = JSON.parse(localStorage.getItem("myhr:appearance") || "{}");
    var t = a.theme === "dark" || (a.theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
    document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
</head>
<body>
  <div class="canvas" aria-hidden="true"></div>
  <div id="root"><div class="boot"><span class="spinner lg"></span></div></div>
  <noscript><p style="padding:40px;font-family:sans-serif">myHR needs JavaScript enabled.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
